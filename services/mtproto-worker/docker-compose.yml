services:
  mtproto-worker:
    build: .
    container_name: reelyx-mtproto
    restart: unless-stopped
    env_file: .env
    environment:
      SESSION_DIR: /data/sessions
    ports:
      - "8081:8081"
    volumes:
      - reelyx-sessions:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  reelyx-sessions:
